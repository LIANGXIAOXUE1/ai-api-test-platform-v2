name: pulse-api-v2

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: api_test
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: api_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_user -d api_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      PORT: 8080
      LISTEN_HOST: 0.0.0.0
      PLATFORM_AUTH_USER: ${PLATFORM_AUTH_USER:-local}
      PLATFORM_AUTH_PASSWORD: ${PLATFORM_AUTH_PASSWORD:-local-demo-password-change-me}
      PLATFORM_ALLOWED_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
      PLATFORM_ALLOWED_TARGETS: ${PLATFORM_ALLOWED_TARGETS:-http://host.docker.internal:8082}
      PROJECT_TEST_DATA_DIR: /app/data
      DATABASE_URL: postgres://api_user:api_password@db:5432/api_test?sslmode=disable
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_AUTH_HEADER: ${LLM_AUTH_HEADER:-Authorization}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ../backend/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5174:80"

volumes:
  postgres_data:
