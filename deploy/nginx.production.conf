server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 16m;

  # Protect HTML and assets as well as API; backend also checks credentials.
  auth_request /_platform_auth;
  error_page 401 = @login_required;
  location @login_required {
    add_header WWW-Authenticate 'Basic realm="Pulse API", charset="UTF-8"' always;
    return 401;
  }
  location = /_platform_auth {
    internal;
    auth_request off;
    proxy_pass http://backend:8080/api/access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
  }
  location / { try_files $uri $uri/ /index.html; }
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
    proxy_cache off;
  }
}
